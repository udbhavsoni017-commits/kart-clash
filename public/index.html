<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111935" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kart Clash" />
    <title>Kart Clash — multiplayer arcade battle</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="Kart Clash game area"></canvas>

      <section id="menu" class="panel">
        <div class="logo"><span>KART</span> CLASH</div>
        <p class="tagline">Tiny karts. Big grudges.</p>
        <form id="join-form">
          <label>
            Driver name
            <input id="name" maxlength="14" autocomplete="nickname" placeholder="Your name" value="Driver" />
          </label>
          <label>
            Room code
            <input id="room" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="PITSTOP" value="PITSTOP" />
          </label>
          <button id="join" type="submit">Start engines <span>→</span></button>
          <button id="solo" type="button" class="solo-button">Solo battle <span>vs 3 bots</span></button>
          <button id="install" type="button" class="install-button" hidden>Install Kart Clash <span>↓</span></button>
        </form>
        <p id="install-help" class="hint">Play solo against bots, or send friends this link and use the same room code.</p>
      </section>

      <section id="hud" hidden>
        <div class="hud-top">
          <div class="room-badge"><span>ROOM</span><strong id="room-code">PITSTOP</strong></div>
          <div id="match-timer" class="timer"><span>ROUND 1 / 3</span><strong>3:00</strong></div>
          <div id="status" class="status"><i></i><span>Waiting for drivers…</span></div>
          <button id="start-match" class="start-match" hidden>Start multiplayer match</button>
          <button id="leave" class="icon-button" title="Leave lobby" aria-label="Leave lobby">×</button>
        </div>
        <aside id="leaderboard" class="leaderboard"></aside>
        <div id="self-card" class="self-card"></div>
        <div id="message" class="message"></div>
      </section>

      <section id="touch-controls" hidden aria-label="Touch controls">
        <div class="touch-wheel">
          <button data-key="left" class="touch-key left" aria-label="Turn left">◀</button>
          <button data-key="right" class="touch-key right" aria-label="Turn right">▶</button>
          <button data-key="up" class="touch-key up" aria-label="Accelerate">▲</button>
          <button data-key="down" class="touch-key down" aria-label="Brake">▼</button>
        </div>
        <button id="touch-fire" class="fire-button" aria-label="Fire weapon">FIRE</button>
      </section>

      <div id="disconnected" class="toast" hidden>Reconnecting to race control…</div>
      <div class="controls"><b>WASD / arrows</b> drive <em>•</em> <b>Space</b> fire</div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/game.js"></script>
  </body>
</html>
